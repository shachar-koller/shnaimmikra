name: iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build app and test ShnayimCore
    # Standard hosted runners are free for public repositories. Revisit costs
    # with the owner before running this workflow if the repository is private.
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Run Swift package tests
        run: |
          set -o pipefail
          mkdir -p ci-results
          swift test --package-path ios/ShnayimCore 2>&1 | tee ci-results/swift-tests.log

      - name: Build unsigned iOS Simulator app
        id: simulator
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p ci-results
          xcodebuild build \
            -project ios/ShnayimMikra.xcodeproj \
            -scheme ShnayimMikra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ShnayimMikra-DerivedData" \
            -resultBundlePath ci-results/SimulatorBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            2>&1 | tee ci-results/simulator-build.log

      # Launches the built app as a guest and screenshots each screen, so changes
      # can be seen without a Mac. Launch arguments are handled only in Debug builds.
      - name: Launch in Simulator and take screenshots
        id: screenshots
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p ci-results/screenshots
          APP="$RUNNER_TEMP/ShnayimMikra-DerivedData/Build/Products/Debug-iphonesimulator/ShnayimMikra.app"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
          print((phones or [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")])[0]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=com.shacharkoller.ShnayimMikra
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 6
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
              echo "::error::The app is not running after launching for $name"
              xcrun simctl io "$UDID" screenshot "ci-results/screenshots/$name-after-crash.png" || true
              find ~/Library/Logs/DiagnosticReports -name 'ShnayimMikra*' -mmin -5 -exec cp {} ci-results/ \; 2>/dev/null || true
              exit 1
            fi
            xcrun simctl io "$UDID" screenshot "ci-results/screenshots/$name.png"
          }
          shot 01-welcome
          G=(-shnaim-mikra-guest-choice YES -debugSample YES -debugTheme grayscale)
          shot 02-tracker "${G[@]}"
          shot 03-chumash-flow "${G[@]}" -debugTab chumash -shnaim-mikra-reader-mode:guest flow
          shot 04-chumash-cards "${G[@]}" -debugTab chumash -shnaim-mikra-reader-mode:guest cards
          shot 05-chumash-classic "${G[@]}" -debugTab chumash -shnaim-mikra-reader-mode:guest classic
          shot 06-settings "${G[@]}" -debugTab settings
          shot 07-account "${G[@]}" -debugTab account
          shot 08-tracker-midnight -shnaim-mikra-guest-choice YES -debugTheme midnight
          shot 09-chumash-parchment -shnaim-mikra-guest-choice YES -debugTheme parchment -debugTab chumash
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "ShnayimMikra"' > ci-results/app.log 2>&1 || true

      # An unsigned app for real iPhones. Sideloadly or AltStore sign it with a
      # free Apple ID when installing. Sign-in works only if the repository
      # variables SUPABASE_HOST and SUPABASE_ANON_KEY are set (the public anon key).
      - name: Build unsigned iPhone app (.ipa)
        id: ipa
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        env:
          SUPABASE_HOST: ${{ vars.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -n "$SUPABASE_HOST" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\n' "$SUPABASE_HOST" "$SUPABASE_ANON_KEY" > ios/Config/Supabase.xcconfig
            echo "Building with sign-in for $SUPABASE_HOST"
          else
            echo "::notice::SUPABASE_HOST and SUPABASE_ANON_KEY are not set, so this app has no sign-in."
          fi
          xcodebuild build \
            -project ios/ShnayimMikra.xcodeproj \
            -scheme ShnayimMikra \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ShnayimMikra-Device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            2>&1 | tee ci-results/device-build.log
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ShnayimMikra-Device/Build/Products/Release-iphoneos/ShnayimMikra.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry ShnayimMikra.ipa Payload)
          mkdir -p ipa && mv "$RUNNER_TEMP/ipa/ShnayimMikra.ipa" ipa/
          ls -lh ipa/ShnayimMikra.ipa

      - name: Upload iPhone app
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShnayimMikra-ipa-${{ github.run_number }}
          path: ipa/ShnayimMikra.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-diagnostics-${{ github.run_number }}
          path: |
            ci-results/
            ios/ShnayimMikra.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: warn
          retention-days: 3
